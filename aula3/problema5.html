<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Objeto com Input</title>
</head>
<body>
  <h2>Cadastro de Pessoa</h2>

  <!-- Campos para preencher -->
  <input type="text" id="nome" placeholder="Nome"><br><br>
  <input type="number" id="idade" placeholder="Idade"><br><br>
  <input type="text" id="cidade" placeholder="Cidade"><br><br>

  <!-- Botões -->
  <button onclick="salvarPessoa()">Salvar Pessoa</button>
  <button onclick="mostrarPessoa()">Mostrar Pessoa</button>

  <p id="saida"></p>

  <script>
    // Objeto inicial vazio
    let pessoa = {
      nome: "",
      idade: 0,
      cidade: ""
    };

    // Função para salvar os dados da pessoa
    function salvarPessoa() {
      pessoa.nome = document.getElementById("nome").value;
      pessoa.idade = document.getElementById("idade").value;
      pessoa.cidade = document.getElementById("cidade").value;

      document.getElementById("saida").innerHTML = 
        "Dados salvos com sucesso!";
    }

    // Função para mostrar os dados
    function mostrarPessoa() {
      if (pessoa.nome === "" || pessoa.idade === 0 || pessoa.cidade === "") {
        document.getElementById("saida").innerHTML = "Nenhuma pessoa cadastrada!";
      } else {
        document.getElementById("saida").innerHTML = 
          "<b>Nome:</b> " + pessoa.nome + "<br>" +
          "<b>Idade:</b> " + pessoa.idade + "<br>" +
          "<b>Cidade:</b> " + pessoa.cidade;
      }
    }
  </script>
</body>
</html>
