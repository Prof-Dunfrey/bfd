<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Instagram</title>
    <link rel="stylesheet" href="output.css">
    <link rel="stylesheet" href="https://use.fontawesome.com/releases/v5.6.3/css/all.css"
        integrity="sha384-UHRtZLI+pbxtHCWp1t77Bi1L4ZtiqrqD80Kn4Z8NTSRyMA2Fd33n5dQ8lWUE00s/" crossorigin="anonymous">
</head>

<body class="min-h-screen flex flex-col">
    <main class="flex-1 flex justify-center items-center">
        <!-- Imagem principal -->
        <div class="flex justify-end items-center">

            <img class="h-max" src="../img/landing-2x.png" alt="">

        </div>
        <!-- formulario -->
        <div class="flex flex-col justify-center items-center">
            <form class="w-80 flex flex-col justify-center items-center px-10 py-4 gap-2">
                
                <img class="w-48" src="../img/Instagram-Logo-2016-present.png" alt="">
               
                <input type="text" class="bg-gray-100 border rounded-sm w-full p-2"
                    placeholder="Telefone, nome do usuário ou e-mail">
                <input type="password" class="bg-gray-100 border rounded-sm w-full p-2" placeholder="Senha">
                <button class="bg-indigo-300 text-white w-full rounded-2xl p-2 hover:bg-blue-300">Iniciar
                    Sessão</button>
                <a href="#" class="text-blue-700 font-semibold cursor-pointer"><i class="fab fa-linkedin"></i> Entrar
                    com Facebook</a>
                <a href="#" class="text-sm cursor-pointer">Esqueceu a senha?</a>
            </form>

            <span class="px-2 text-sm">OU</span>


            <div class="flex gap-2 mt-4">
                <p>Não tem uma conta? <a href="#" class="text-blue-700 font-semibold">Cadastre-se</a></p>
            </div>
        </div>
    </main>
    <!-- rodape -->
    <footer class="py-6">
        <ul class="flex flex-wrap gap-4 justify-center text-sm text-slate-400">
            <li>Meta</li>
            <li>Sobre</li>
            <li>Blog</li>
            <li>Carreiras</li>
            <li>Ajuda</li>
            <li>API</li>
            <li>Privacidade</li>
            <li>Termos</li>
            <li>Localizações</li>
            <li>Instagram Lite</li>
            <li>Meta IA</li>
            <li>Meta AI Artigos</li>
            <li>Threads</li>

        </ul>
        <ul class="flex flex-wrap gap-4 justify-center text-sm text-slate-400 py-4">
            <li>Português (Brasil)</li>
            <li>© Instagram 2025 da Meta</li>
        </ul>
    </footer>

</body>

</html>
