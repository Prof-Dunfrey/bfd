<!DOCTYPE html>
<html lang="en">
<head>
<title>CSS Template</title>
<meta charset="utf-8">
<style>
header {
  background-color: #666;
  text-align: center;
  color: rgb(255, 168, 168);
  padding: 1px;
}

nav {
  float: left;
  width: 20%;
  height: 100px; 
  background: #ccc;
  padding: 20px;
}

nav ul {
  list-style-type: none;
}

article {
  float: left;
  width: 70%;
  background-color: #f1f1f1;
  height: 100px;
padding: 20px;
}

footer {
    float: left;
  background-color: #777;
  text-align: center;
  color: rgb(5, 255, 9);
  height: 50px;
  width: 100%;
  padding: 1px;
}
</style>
</head>
<body>

<h2>CSS Layout Float</h2>
<p>Neste exemplo nós criamos um header, duas colunas e um rodapé.</p>

<header>
  <h2>Cidades</h2>
</header>

<section>
  <nav>
    <ul>
      <li><a href="#">Londres</a></li>
      <li><a href="#">Paris</a></li>
      <li><a href="#">Tokio</a></li>
    </ul>
  </nav>
  
  <article>
    <h1>Londres</h1>
    <p>BLA BLA BLA BLA BLA.</p>
    <p>BLE BLE BLE BLE BLE BLE BLE.</p>
  </article>
</section>

<footer>
  <p>Rodapé</p>
</footer>

</body>
</html>
